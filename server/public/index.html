<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatMD Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-chat: #090d16;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-sent: #2563eb;
      --bubble-recv: #1e293b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Screen Views */
    .view {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }
    .view.active {
      display: flex;
    }

    /* ─── CONNECT SCREEN ─── */
    #connect-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%);
    }

    .connect-card {
      width: 100%;
      max-width: 400px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .logo-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .status-alert {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status-alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      display: block;
    }

    /* ─── CONTACTS SCREEN ─── */
    .header {
      height: 60px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 13px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin: 12px 0 8px 4px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contact-item:active {
      background: #334155;
    }
    .contact-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
    }
    .contact-name {
      font-size: 15px;
      font-weight: 600;
    }
    .badge {
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .no-contacts {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 14px;
    }

    /* ─── CHAT SCREEN ─── */
    .chat-header {
      height: 60px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .btn-back {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .chat-title-info {
      flex: 1;
    }
    .chat-partner-name {
      font-size: 16px;
      font-weight: 700;
    }
    .chat-partner-status {
      font-size: 12px;
      color: var(--accent-green);
    }

    .messages-container {
      flex: 1;
      background: var(--bg-chat);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.45;
      word-wrap: break-word;
      position: relative;
    }
    .message-bubble.sent {
      align-self: flex-end;
      background: var(--bubble-sent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message-bubble.received {
      align-self: flex-start;
      background: var(--bubble-recv);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }
    .message-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-bar {
      min-height: 64px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 16px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--primary);
    }
    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-file {
      background: #334155;
    }
    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- CONNECT VIEW -->
  <div id="connect-screen" class="view active">
    <div class="connect-card">
      <div class="logo-container">
        <div class="logo-title">ChatMD Mobile</div>
        <div class="logo-subtitle">Intranet Volatile Chat (HP Client)</div>
      </div>

      <div class="form-group">
        <label>Nama Pengguna (Username)</label>
        <input type="text" id="input-username" class="form-control" placeholder="Contoh: Budi_HP" maxlength="20">
      </div>

      <div class="form-group">
        <label>IP Server PC</label>
        <input type="text" id="input-ip" class="form-control" placeholder="192.168.1.X">
      </div>

      <div class="form-group">
        <label>Port WebSocket</label>
        <input type="number" id="input-port" class="form-control" value="8765">
      </div>

      <button id="btn-connect" class="btn-primary">Hubungkan ke PC</button>
      <div id="connect-error" class="status-alert error"></div>
    </div>
  </div>

  <!-- CONTACTS VIEW -->
  <div id="contacts-screen" class="view">
    <div class="header">
      <div class="header-title">ChatMD</div>
      <div class="user-pill">
        <div class="status-dot"></div>
        <span id="display-username">User</span>
      </div>
    </div>

    <div class="contacts-list">
      <div class="section-label">Pengguna Aktif di Intranet</div>
      <div id="contacts-container"></div>
    </div>
  </div>

  <!-- CHAT VIEW -->
  <div id="chat-screen" class="view">
    <div class="chat-header">
      <button id="btn-back" class="btn-back">←</button>
      <div class="chat-title-info">
        <div id="chat-partner-name" class="chat-partner-name">Partner</div>
        <div class="chat-partner-status">Online</div>
      </div>
    </div>

    <div id="messages-container" class="messages-container"></div>

    <div class="chat-input-bar">
      <input type="file" id="file-input">
      <button id="btn-attach" class="btn-icon btn-file">📎</button>
      <input type="text" id="chat-input" class="chat-input" placeholder="Tulis pesan..." autocomplete="off">
      <button id="btn-send" class="btn-icon">➤</button>
    </div>
  </div>

  <script>
    // ─── AES-128-GCM Web Crypto ───
    const KEY_HEX = "436861744d442d414553474d2d4b6579"; // "ChatMD-AESGCM-Key"
    let cryptoKey = null;

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
      }
      return bytes;
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function initCrypto() {
      const keyBytes = hexToBytes(KEY_HEX);
      cryptoKey = await crypto.subtle.importKey(
        "raw", keyBytes, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage(text) {
      const nonce = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: nonce }, cryptoKey, encoded
      );
      const combined = new Uint8Array(nonce.length + ciphertext.byteLength);
      combined.set(nonce, 0);
      combined.set(new Uint8Array(ciphertext), nonce.length);
      return bytesToHex(combined);
    }

    async function decryptMessage(hexStr) {
      try {
        const bytes = hexToBytes(hexStr);
        const nonce = bytes.slice(0, 12);
        const data = bytes.slice(12);
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: nonce }, cryptoKey, data
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return "[Pesan tidak dapat didekripsi]";
      }
    }

    // ─── Application State ───
    let ws = null;
    let myUsername = "";
    let activePartner = null;
    let userList = [];
    let unreadCounts = {};
    let chatHistories = {}; // partner -> [{sender, text, file, time}]

    // Load saved settings
    document.addEventListener("DOMContentLoaded", async () => {
      await initCrypto();

      const savedIP = localStorage.getItem("chatmd_ip") || window.location.hostname || "";
      const savedUser = localStorage.getItem("chatmd_user") || "";
      document.getElementById("input-ip").value = savedIP;
      document.getElementById("input-username").value = savedUser;
    });

    // ─── Screen Navigation ───
    function showScreen(screenId) {
      document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    // ─── Connection Handler ───
    document.getElementById("btn-connect").addEventListener("click", () => {
      const username = document.getElementById("input-username").value.trim();
      const ip = document.getElementById("input-ip").value.trim();
      const port = document.getElementById("input-port").value.trim() || "8765";
      const errEl = document.getElementById("connect-error");

      errEl.style.display = "none";

      if (!username) {
        errEl.innerText = "Username wajib diisi!";
        errEl.style.display = "block";
        return;
      }
      if (!ip) {
        errEl.innerText = "IP Server wajib diisi!";
        errEl.style.display = "block";
        return;
      }

      localStorage.setItem("chatmd_user", username);
      localStorage.setItem("chatmd_ip", ip);

      myUsername = username;
      const wsUrl = `ws://${ip}:${port}`;

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        errEl.innerText = "Gagal membuat koneksi WebSocket.";
        errEl.style.display = "block";
        return;
      }

      ws.onopen = () => {
        // Register client
        ws.send(JSON.stringify({ type: "register", username: myUsername }));
      };

      ws.onmessage = async (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (_) { return; }

        if (msg.type === "registered") {
          document.getElementById("display-username").innerText = myUsername;
          showScreen("contacts-screen");
        } else if (msg.type === "error") {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            errEl.innerText = msg.message;
            errEl.style.display = "block";
          }
        } else if (msg.type === "user_list") {
          userList = msg.users.filter(u => u !== myUsername);
          renderContacts();
        } else if (msg.type === "message") {
          await handleIncomingMessage(msg);
        }
      };

      ws.onerror = () => {
        errEl.innerText = "Koneksi ke server gagal/ditolak. Periksa IP!";
        errEl.style.display = "block";
      };

      ws.onclose = () => {
        showScreen("connect-screen");
        errEl.innerText = "Koneksi terputus dari server.";
        errEl.style.display = "block";
      };
    });

    // ─── Contacts Render ───
    function renderContacts() {
      const container = document.getElementById("contacts-container");
      container.innerHTML = "";

      if (userList.length === 0) {
        container.innerHTML = '<div class="no-contacts">Belum ada pengguna lain yang online</div>';
        return;
      }

      userList.forEach(user => {
        const item = document.createElement("div");
        item.className = "contact-item";
        const unread = unreadCounts[user] || 0;
        const initial = user.charAt(0).toUpperCase();

        item.innerHTML = `
          <div class="contact-info">
            <div class="avatar">${initial}</div>
            <div class="contact-name">${user}</div>
          </div>
          ${unread > 0 ? `<div class="badge">${unread}</div>` : ''}
        `;

        item.addEventListener("click", () => openChat(user));
        container.appendChild(item);
      });
    }

    // ─── Open Chat ───
    function openChat(partner) {
      activePartner = partner;
      unreadCounts[partner] = 0;
      renderContacts();

      document.getElementById("chat-partner-name").innerText = partner;
      renderMessages();
      showScreen("chat-screen");
    }

    document.getElementById("btn-back").addEventListener("click", () => {
      activePartner = null;
      showScreen("contacts-screen");
    });

    // ─── Handle Incoming Message ───
    async function handleIncomingMessage(data) {
      const sender = data.sender;
      const decrypted = await decryptMessage(data.payload);

      if (!chatHistories[sender]) {
        chatHistories[sender] = [];
      }

      const msgObj = {
        sender: sender,
        text: decrypted,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      chatHistories[sender].push(msgObj);

      if (activePartner === sender) {
        renderMessages();
      } else {
        unreadCounts[sender] = (unreadCounts[sender] || 0) + 1;
        renderContacts();
      }
    }

    // ─── Render Messages ───
    function renderMessages() {
      const container = document.getElementById("messages-container");
      container.innerHTML = "";

      const history = chatHistories[activePartner] || [];

      history.forEach(m => {
        const bubble = document.createElement("div");
        const isSent = m.sender === myUsername;
        bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
        
        let contentHtml = escapeHtml(m.text);
        
        bubble.innerHTML = `
          <div>${contentHtml}</div>
          <div class="message-time">${m.time}</div>
        `;
        container.appendChild(bubble);
      });

      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // ─── Send Message ───
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("chat-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !activePartner || !ws) return;

      const encrypted = await encryptMessage(text);

      ws.send(JSON.stringify({
        type: "message",
        target: activePartner,
        payload: encrypted
      }));

      if (!chatHistories[activePartner]) {
        chatHistories[activePartner] = [];
      }

      chatHistories[activePartner].push({
        sender: myUsername,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = "";
      renderMessages();
    }

    // ─── Attach File ───
    document.getElementById("btn-attach").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const base64Data = evt.target.result;
        const fileMsg = `[FILE: ${file.name}] (${(file.size/1024).toFixed(1)} KB)\nData: ${base64Data}`;
        
        const input = document.getElementById("chat-input");
        input.value = fileMsg;
        sendMessage();
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
