apply plugin: 'com.android.application'

android {
    namespace 'com.chatmd.client'
    compileSdk 33

    defaultConfig {
        applicationId "com.chatmd.client"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
